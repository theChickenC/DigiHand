<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8EDF5"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0B1B3A" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- app tile -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#tile)"/>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="6"/>

  <!-- handwritten page, slightly tilted -->
  <g transform="rotate(-5 256 256)" filter="url(#soft)">
    <rect x="148" y="112" width="216" height="288" rx="18" fill="url(#page)"/>
    <!-- handwriting strokes: wavy, uneven, rounded -->
    <g stroke="#94A3B8" stroke-width="13" stroke-linecap="round" fill="none">
      <path d="M184 168 q 26 -10 52 0 t 52 0 t 34 2"/>
      <path d="M184 216 q 30 -9 58 1 t 62 -3"/>
      <path d="M184 264 q 24 -10 50 0 t 46 1 t 26 -2"/>
      <path d="M184 312 q 28 -9 54 1 t 58 -2"/>
    </g>
    <!-- one accent stroke being "digitised" -->
    <path d="M184 360 q 30 -10 60 0 t 64 -1" stroke="#4F46E5" stroke-width="13" stroke-linecap="round" fill="none"/>
  </g>

  <!-- digital scan brackets -->
  <g stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" fill="none" opacity="0.95">
    <path d="M118 158 v-44 q0 -16 16 -16 h44"/>
    <path d="M394 158 v-44 q0 -16 -16 -16 h-44"/>
    <path d="M118 354 v44 q0 16 16 16 h44"/>
    <path d="M394 354 v44 q0 16 -16 16 h-44"/>
  </g>

  <!-- lightning badge (nod to the old solve icon) -->
  <g transform="translate(392 392)">
    <circle r="56" fill="#FBBF24" stroke="#FFFFFF" stroke-width="8"/>
    <path d="M8 -36 L-20 6 h16 l-8 30 28 -40 h-16 z" fill="#1E293B"/>
  </g>
</svg>
