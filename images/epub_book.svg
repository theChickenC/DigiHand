<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- open book with bookmark: 'To ePub' toolbar icon -->
  <!-- left page -->
  <path d="M32 15 C 26 10, 14 9, 5 11 L 5 47 C 14 45, 26 46, 32 51 Z"
        fill="#efe9da" stroke="#4a4a4a" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- right page -->
  <path d="M32 15 C 38 10, 50 9, 59 11 L 59 47 C 50 45, 38 46, 32 51 Z"
        fill="#fdfaf2" stroke="#4a4a4a" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- spine -->
  <line x1="32" y1="15" x2="32" y2="51" stroke="#4a4a4a" stroke-width="2.5"/>
  <!-- text lines, left page -->
  <g stroke="#9aa5b1" stroke-width="2.5" stroke-linecap="round">
    <path d="M11 20 H 25"/>
    <path d="M11 26 H 26"/>
    <path d="M11 32 H 25"/>
    <path d="M11 38 H 23"/>
  </g>
  <!-- text lines, right page (clear of the bookmark) -->
  <g stroke="#9aa5b1" stroke-width="2.5" stroke-linecap="round">
    <path d="M38 30 H 54"/>
    <path d="M38 36 H 54"/>
    <path d="M38 42 H 51"/>
  </g>
  <!-- bookmark ribbon over the right page edge (wide enough to read at 16px) -->
  <path d="M43.5 8.9 V 27 L 49 22.5 L 54.5 27 V 9.9 C 50.8 9.1, 47.1 8.9, 43.5 8.9 Z"
        fill="#d64541" stroke="#8e2b28" stroke-width="1.5" stroke-linejoin="round"/>
</svg>
